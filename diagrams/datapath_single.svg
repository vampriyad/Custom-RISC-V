<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="white"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="bold">Single-cycle core datapath (core_single)</text>

  <!-- PC -->
  <rect x="30" y="180" width="70" height="46" rx="6" fill="#4C6EF5" stroke="#1864AB"/>
  <text x="65" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="white">PC</text>

  <!-- imem -->
  <rect x="145" y="160" width="90" height="86" rx="6" fill="#E9ECEF" stroke="#868E96"/>
  <text x="190" y="198" text-anchor="middle" font-size="12" font-weight="bold">instr mem</text>
  <text x="190" y="216" text-anchor="middle" font-size="10" fill="#555">(async ROM)</text>
  <line x1="100" y1="203" x2="145" y2="203" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- decoder -->
  <rect x="275" y="70" width="100" height="58" rx="6" fill="#FFD8A8" stroke="#F59F00"/>
  <text x="325" y="95" text-anchor="middle" font-size="12" font-weight="bold">decoder</text>
  <text x="325" y="113" text-anchor="middle" font-size="10" fill="#555">+ imm gen</text>
  <line x1="235" y1="185" x2="275" y2="110" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="238" y="140" font-size="10" fill="#555">instr</text>

  <!-- regfile -->
  <rect x="275" y="185" width="100" height="90" rx="6" fill="#D0EBFF" stroke="#1971C2"/>
  <text x="325" y="218" text-anchor="middle" font-size="12" font-weight="bold">regfile</text>
  <text x="325" y="236" text-anchor="middle" font-size="10" fill="#555">32 x 32</text>
  <text x="325" y="254" text-anchor="middle" font-size="10" fill="#555">x0 = 0</text>
  <line x1="235" y1="215" x2="275" y2="215" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ALU -->
  <polygon points="470,165 560,165 560,255 470,255 440,210" fill="#B2F2BB" stroke="#2F9E44"/>
  <text x="505" y="205" text-anchor="middle" font-size="13" font-weight="bold">ALU</text>
  <text x="505" y="223" text-anchor="middle" font-size="10" fill="#555">add..mul, slt</text>
  <line x1="375" y1="205" x2="445" y2="198" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="245" x2="445" y2="232" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="392" y="185" font-size="10" fill="#555">rs1</text>
  <text x="392" y="262" font-size="10" fill="#555">rs2 / imm</text>
  <line x1="325" y1="128" x2="430" y2="170" stroke="#E8590C" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
  <line x1="325" y1="128" x2="330" y2="185" stroke="#E8590C" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
  <text x="368" y="140" font-size="10" fill="#E8590C">control</text>

  <!-- dmem -->
  <rect x="615" y="175" width="90" height="80" rx="6" fill="#E9ECEF" stroke="#868E96"/>
  <text x="660" y="208" text-anchor="middle" font-size="12" font-weight="bold">data mem</text>
  <text x="660" y="226" text-anchor="middle" font-size="10" fill="#555">(async read)</text>
  <line x1="560" y1="210" x2="615" y2="210" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="572" y="200" font-size="10" fill="#555">addr</text>

  <!-- wb mux -->
  <polygon points="760,185 790,185 805,215 790,245 760,245 775,215" fill="#E5DBFF" stroke="#7048E8"/>
  <text x="783" y="270" text-anchor="middle" font-size="10" fill="#7048E8">wb mux</text>
  <line x1="705" y1="205" x2="765" y2="205" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="245" x2="770" y2="240" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="805" y1="215" x2="325" y2="320" stroke="#333" stroke-width="1.5"/>
  <line x1="325" y1="320" x2="325" y2="275" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="308" font-size="11" fill="#333">writeback</text>

  <!-- custom unit -->
  <rect x="440" y="330" width="180" height="56" rx="6" fill="#E5DBFF" stroke="#7048E8"/>
  <text x="530" y="353" text-anchor="middle" font-size="12" font-weight="bold">dot-product unit (CDOT)</text>
  <text x="530" y="371" text-anchor="middle" font-size="10" fill="#555">4 x mul + adder tree</text>
  <line x1="530" y1="330" x2="530" y2="255" stroke="#7048E8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- pc + 4 -->
  <rect x="30" y="330" width="70" height="40" rx="6" fill="#FFE3E3" stroke="#E03131"/>
  <text x="65" y="355" text-anchor="middle" font-size="11" font-weight="bold">pc + 4</text>
  <line x1="100" y1="350" x2="65" y2="350" stroke="#E03131" stroke-width="1.2"/>
  <line x1="65" y1="330" x2="65" y2="226" stroke="#E03131" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
  <line x1="65" y1="330" x2="440" y2="252" stroke="#E03131" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
  <text x="120" y="326" font-size="10" fill="#E03131">branch target (pc+imm) also feeds PC</text>

  <text x="24" y="445" font-size="11" fill="#868E96">Everything happens inside one clock period: fetch, decode, execute, memory and writeback. That keeps CPI = 1.00 but makes the critical path the whole machine.</text>
</svg>
